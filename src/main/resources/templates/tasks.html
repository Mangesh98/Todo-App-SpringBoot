<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Todo Application</title>
</head>
<body>
<h1>Todo Application</h1>
<form action="/" method="post">
    <div>
        <input type="text" name="title" id="" placeholder="Add a new Task..." required>
    </div>
    <div>
        <button type="submit">Add</button>
    </div>
</form>
<th:block th:each="task : ${tasks}">
    <div>
        <span th:text="${task.id}">Task id</span>
        <span th:text="${task.title}">Task Title</span>
        <span th:text="${task.completed}">Completed</span>
    </div>
</th:block>
</body>
</html>
